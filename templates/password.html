{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<form method="post" class="max-w-sm bg-white rounded-2xl shadow p-6 space-y-4">
  <h1 class="text-xl font-semibold">Change password</h1>
  {% for name, label in [("current","Current password"),("new","New password"),("confirm","Confirm new password")] %}
  <label class="block text-sm">{{ label }}
    <input name="{{ name }}" type="password" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
  </label>
  {% endfor %}
  <button class="rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 font-medium">Save</button>
</form>
{% endblock %}
